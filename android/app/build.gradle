plugins {
	id "com.android.application"
}

android {
	namespace "com.sfml.backgammon"
	compileSdk 34

	defaultConfig {
		applicationId "com.sfml.backgammon"
		minSdk 24
		targetSdk 34
		versionCode 1
		versionName "1.0"

		externalNativeBuild {
			cmake {
				cppFlags "-std=c++17"
			}
		}
		ndk {
			abiFilters "armeabi-v7a", "arm64-v8a"
		}
	}

	buildTypes {
		debug {
			jniDebuggable true
		}
		release {
			minifyEnabled false
		}
	}

	externalNativeBuild {
		cmake {
			path "src/main/cpp/CMakeLists.txt"
		}
	}

	ndkVersion "26.3.11579264"
}

dependencies {
}
